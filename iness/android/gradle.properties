# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE override settings in this file.
# https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
android.nativeBuild.jobs=2

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Optimize production builds with R8. Keep debug builds unminified so local
# development and diagnostics retain readable stack traces.
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true
# AGP 8.12's experimental integrated shrinker crashes in R8 8.12.14 for this
# app. Standard resource shrinking and R8 code optimization stay enabled.
android.r8.optimizedResourceShrinking=false

# Architectures can be overridden with -PreactNativeArchitectures=x86_64.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native architecture and JavaScript engine
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Expo image support
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Development tooling
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Native packaging
expo.useLegacyPackaging=false
expo.inlineModules.watchedDirectories=[]

# Android SDK levels
android.minSdkVersion=26
android.compileSdkVersion=36
android.targetSdkVersion=36

# Never put release signing passwords here. EAS injects its remote signing
# credentials. For local store builds, put MYAPP_RELEASE_* properties in
# ~/.gradle/gradle.properties and keep the keystore outside version control.
